name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install libusb
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config
          else
            brew install libusb pkg-config
          fi
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: Static Linux builds
        if: runner.os == 'Linux'
        run: make linux

  ui:
    name: Admin UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Build
        run: make ui
      - name: Built UI is committed
        run: |
          git status --porcelain internal/agent/web/dist
          test -z "$(git status --porcelain internal/agent/web/dist)" || {
            echo "internal/agent/web/dist is out of date: run 'make ui' and commit it." >&2
            exit 1
          }
